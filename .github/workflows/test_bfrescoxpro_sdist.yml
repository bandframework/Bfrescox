name: Test manual bfrescoxpro installation
env:
  BFRESCOXPRO_PATH: ${{ github.workspace }}/bfrescoxpro_pypkg
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  #####----- FULL TESTING WITHOUT COVERAGE
  # Prefer full end-to-end test using package installed on demand from source
  # distribution rather than testing in local clone alone or with a tox task.
  test_openmpi_installation:
    strategy:
      matrix:
        # Python versions should be maintained consistent with those in setup.py
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, macos-15, macos-26, macos-26-intel]
        mpi_impl: ["openmpi"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Install compiler suite
      run: |
        # Several gfortran installed in brew by default, but no simple gfortran
        # found in PATH.
        if [ "${{ runner.os }}" = "macOS" ]; then
           HOMEBREW_BIN_PATH=$(brew --prefix gcc)/bin
           echo "$HOMEBREW_BIN_PATH" >> $GITHUB_PATH
        fi

    - name: Install ${{ matrix.mpi_impl }}
      run: |
        if   [ "${{ runner.os }}" = "Linux" ]; then
           sudo apt-get update
           if   [ "${{ matrix.mpi_impl }}" = "openmpi" ]; then
              sudo apt-get -y install openmpi-bin libopenmpi-dev
           else
              echo "Cannot install ${{ matrix.mpi_impl }} for Linux"
              exit 1
           fi
        elif [ "${{ runner.os }}" = "macOS" ]; then
           brew update
           if   [ "${{ matrix.mpi_impl }}" = "openmpi" ]; then
              brew install open-mpi
           else
              echo "Cannot install ${{ matrix.mpi_impl }} for macOS"
              exit 1
           fi
        fi

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Build, install, & test bfrescoxpro
      run: |
        echo ""
        python -m pip install --upgrade pip
        python -m pip install build
        # Build source distribution & install
        pushd $BFRESCOXPRO_PATH
        python -m build --sdist
        python -m pip install -v dist/bfrescoxpro-*.tar.gz
        popd
        # Log info
        echo ""
        which python
        python -m pip list
        # Run tests through package
        echo ""
        python -c "import bfrescoxpro ; exit(not bfrescoxpro.test())"

  # We presently need to build with MPICH using a workaround (Issue #17).  Once
  # this is resolved, this job should be merged into the job above.
  test_mpich_installation:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, macos-15, macos-26, macos-26-intel]
        mpi_impl: ["mpich"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Install compiler suite
      run: |
        if [ "${{ runner.os }}" = "macOS" ]; then
           HOMEBREW_BIN_PATH=$(brew --prefix gcc)/bin
           echo "$HOMEBREW_BIN_PATH" >> $GITHUB_PATH
        fi

    - name: Install ${{ matrix.mpi_impl }}
      run: |
        if   [ "${{ runner.os }}" = "Linux" ]; then
           sudo apt-get update
           if [ "${{ matrix.mpi_impl }}" = "mpich" ]; then
              sudo apt-get -y install mpich libmpich-dev
           else
              echo "Cannot install ${{ matrix.mpi_impl }} for Linux"
              exit 1
           fi
        elif [ "${{ runner.os }}" = "macOS" ]; then
           brew update
           if [ "${{ matrix.mpi_impl }}" = "mpich" ]; then
              brew install mpich
           else
              echo "Cannot install ${{ matrix.mpi_impl }} for macOS"
              exit 1
           fi
        fi

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Build, install, & test bfrescoxpro
      run: |
        set -euxo pipefail

        python -m pip install --upgrade pip
        python -m pip install build

        pushd "$BFRESCOXPRO_PATH"
        python -m build --sdist
        BFRESCOX_USE_MPI=enabled python -m pip install -v dist/bfrescoxpro-*.tar.gz
        popd

        which python
        python -m pip list

        echo "MPI diagnostics"
        which mpirun || true
        which mpiexec || true
        mpirun --version || true
        mpiexec --version || true
        which mpifort || true
        mpifort -show || true

        echo "Smoke-test MPI"
        mpirun -np 2 hostname

        echo "bfrescoxpro info"
        python - <<'PY'
        import bfrescoxpro
        bfrescoxpro.print_information()
        PY

        echo "Linked libraries"
        python - <<'PY'
        import bfrescoxpro, subprocess, sys
        exe = bfrescoxpro.information()["frescox_exe"]
        print("frescox exe:", exe)
        subprocess.run(["otool", "-L", exe] if sys.platform == "darwin" else ["ldd", exe], check=False)
        PY

        set +e
        python -c "import bfrescoxpro ; exit(not bfrescoxpro.test())"
        status=$?

        if [ "$status" -ne 0 ]; then
          echo "Dumping generated Frescox inputs/outputs"
          find "$GITHUB_WORKSPACE" -type f \( -name 'frescox.in' -o -name '*.out' -o -name 'frescox.out' \) \
            -print -exec sh -c 'echo "===== $1 ====="; sed -n "1,240p" "$1"' sh {} \;
        fi

        exit "$status"
